[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ab_bsf"
version = "0.2.0"
description = "Bayesian and frequentist A/B testing: design, evaluation, DiD, CUPED"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=1.5",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "black",
    "isort",
    "flake8",
    "mypy",
    # needed by the Cursor/VS Code mypy extension when it runs from the project venv
    "vscode-common-python-lsp",
]

[tool.setuptools.packages.find]
include = ["ab_bsf*"]

[tool.pytest.ini_options]
testpaths = ["tests", "ab_bsf"]
addopts = "--doctest-modules"

[tool.isort]
profile = "black"
skip = [".venv"]

[tool.mypy]
ignore_missing_imports = true
exclude = ["\\.venv"]
